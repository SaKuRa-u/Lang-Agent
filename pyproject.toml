[project]
name = "lang-agent"
version = "0.1.0"
description = "IDX Stock Multi-Agent with LangGraph + Studio + 9Router"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-openai>=0.2",
  "langchain-core>=0.3",
  "yfinance>=0.2.40",
  "feedparser>=6.0.11",
  "python-dotenv>=1.0",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "langgraph-cli>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
